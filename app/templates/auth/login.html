{% extends "base.html" %}
{% block title %}Log in — Second Brain{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 sb-surface rounded-2xl p-6 shadow-sm border">
  <h1 class="text-lg font-semibold mb-4">Log in</h1>
  <form method="post" class="space-y-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label class="block text-sm mb-1" style="color: var(--ink-secondary)">Email</label>
      <input type="email" name="email" required autofocus class="w-full rounded-lg border bg-transparent px-3 py-2" style="border-color: var(--border)">
    </div>
    <div>
      <label class="block text-sm mb-1" style="color: var(--ink-secondary)">Password</label>
      <input type="password" name="password" required class="w-full rounded-lg border bg-transparent px-3 py-2" style="border-color: var(--border)">
    </div>
    <button type="submit" class="w-full rounded-lg py-2 font-medium text-white" style="background: #2a78d6">Log in</button>
  </form>
</div>
{% endblock %}
